<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oppija</title>
<meta name="description" content="Microlearning for teachers' AI literacy. Three minutes a day. No account, no tracking.">
<meta name="theme-color" content="#E8EDEF">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Oppija">
<meta property="og:description" content="Microlearning for teachers' AI literacy. Three minutes a day.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.oppija.com">

<!-- Favicon is inline so the page makes zero network requests beyond its own files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23146B7C'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23E8EDEF' stroke-width='6'/%3E%3C/svg%3E">

<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Every string below is injected from content.js. There is no user-visible
     text hardcoded in this file. -->
<main class="app" id="app">

  <!-- 1. language (first visit only) -->
  <section class="screen" id="s-lang" aria-labelledby="lang-h"></section>

  <!-- 2. home -->
  <section class="screen" id="s-home"></section>

  <!-- 3. card player -->
  <section class="screen" id="s-player"></section>

  <!-- 4. completion -->
  <section class="screen" id="s-done"></section>

  <!-- overlays -->
  <div class="sheet"   id="sheet"   role="dialog" aria-modal="true"></div>
  <div class="overlay" id="about"   role="dialog" aria-modal="true"></div>
  <div class="hint"    id="hint"    role="dialog" aria-modal="true"></div>
  <div class="toast"   id="toast"   role="status" aria-live="polite"></div>

</main>

<script src="content.js"></script>
<script src="svg.js"></script>
<script src="app.js"></script>
</body>
</html>
