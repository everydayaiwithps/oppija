<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="description" content="Oppija AI — ten short cards for teachers, and a short survey. Research study, University of Jyväskylä.">
<title>Oppija AI</title>
<style>
:root{
  --app-bg:#FAF8F5;
  --post:#FFFFFF;
  --line:#E7E3DC;
  --line-soft:#F1EDE7;
  --text:#191B29;
  --muted:#6B6F80;
  --accent:#3A3F9E;
  --accent-ink:#FFFFFF;
  --accent-soft:#ECEDFA;
  --ok:#1F6B4B;
  --good:#1F6B4B; --good-soft:#E6F1EB;
  --warn:#A8471F; --warn-soft:#FAEDE6;
  --t:150ms cubic-bezier(.4,0,.2,1);
  --col:460px;

  --cat-spark-bg:#FBF0E2;    --cat-spark-fg:#7A4A12;   --cat-spark-a:#E8A74C; --cat-spark-b:#C8642A;
  --cat-mirror-bg:#EFEAFB;   --cat-mirror-fg:#4B3195;  --cat-mirror-a:#8E7BE8; --cat-mirror-b:#5A3FBF;
  --cat-bridge-bg:#FBE9EC;   --cat-bridge-fg:#8A2C42;  --cat-bridge-a:#E8808F; --cat-bridge-b:#B93E5C;
  --cat-compass-bg:#E3F2F0;  --cat-compass-fg:#11574E; --cat-compass-a:#5FB5A5; --cat-compass-b:#1C7A6B;
}
@media (prefers-color-scheme:dark){
  :root{
    --app-bg:#0F1018; --post:#191B26; --line:#2A2D3E; --line-soft:#222432;
    --text:#ECEAF3; --muted:#A0A4B8; --accent:#9CA2FF; --accent-ink:#141531;
    --accent-soft:#232642; --ok:#7FD0A8;
    --good:#7FD0A8; --good-soft:#15291F;
    --warn:#E8A07A; --warn-soft:#2B1D16;
    --cat-spark-bg:#2C2317;    --cat-spark-fg:#EBC489;   --cat-spark-a:#C9913F; --cat-spark-b:#8A5522;
    --cat-mirror-bg:#221D3C;   --cat-mirror-fg:#C3B6F7;  --cat-mirror-a:#7A67D6; --cat-mirror-b:#4A32A0;
    --cat-bridge-bg:#2C1B24;   --cat-bridge-fg:#F0A9BA;  --cat-bridge-a:#C96A7C; --cat-bridge-b:#8E3049;
    --cat-compass-bg:#122B27;  --cat-compass-fg:#8FD6C9; --cat-compass-a:#4E9C8E; --cat-compass-b:#146457;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--app-bg);color:var(--text);font-size:17px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:1ms!important}}

.wrap{max-width:var(--col);margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.screen{animation:fade .25s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}

/* ---------- chrome ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--app-bg);padding-top:calc(12px + env(safe-area-inset-top))}
.bar .inner{max-width:var(--col);margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.brand{font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand span{font-weight:600;color:var(--muted);font-size:11px;display:block;letter-spacing:0}
.step{margin-left:auto;font-size:12.5px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:4px;border-radius:99px;background:var(--line);margin:10px 16px 0;max-width:var(--col);
  margin-left:auto;margin-right:auto}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* ---------- typography ---------- */
h1{font-size:26px;line-height:1.2;letter-spacing:-.025em;font-weight:700;margin:0}
h2{font-size:21px;line-height:1.25;letter-spacing:-.02em;font-weight:650;margin:0}
p{margin:0}
.lede{color:var(--muted);font-size:15.5px;line-height:1.5;margin-top:10px}
.tiny{font-size:12.5px;color:var(--muted);line-height:1.45}

/* ---------- the card ---------- */
.post{background:var(--post);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 1px 2px rgba(25,27,41,.04),0 10px 30px rgba(25,27,41,.06);margin-top:16px}
@media (prefers-color-scheme:dark){.post{box-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4)}}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:15px;box-shadow:0 0 0 2px var(--post),0 0 0 3.5px var(--ring,var(--accent))}
.who{min-width:0;flex:1}
.who b{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:650}
.who b svg{width:13px;height:13px;color:var(--accent);flex:none}
.who>span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-weight:700}
.media{padding:22px 18px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.illus{height:62px;margin-bottom:14px;display:flex;align-items:center;opacity:.9}
.illus svg{height:100%;width:auto;max-width:100%}
.il .m{fill:currentColor;opacity:.15;stroke:none}
.il .s{fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.il .d{fill:currentColor;stroke:none;opacity:.8}
.il .f{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;opacity:.35}
.media h2{margin-bottom:8px;font-size:clamp(21px,5.6vw,25px)}
.setup{font-size:15px;line-height:1.45;opacity:.78;margin-bottom:16px}

/* ---------- the blocks that do the teaching ---------- */
.b{margin-bottom:12px}
.b:last-child{margin-bottom:0}
.b .lab{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;opacity:.85}

/* what the AI produced */
.b-ai{background:var(--post);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:10px;padding:12px 14px}
.b-ai .who{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.b-ai .who svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.b-ai p{font-size:15px;line-height:1.5;font-style:italic}

/* the reality, set against it */
.b-check{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);
  border-radius:10px;padding:12px 14px}
.b-check .ic{width:19px;height:19px;flex:none;border-radius:50%;background:var(--warn);
  display:grid;place-items:center;margin-top:1px}
.b-check .ic svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
.b-check p{font-size:15px;line-height:1.48}

/* do / don't */
.b-good,.b-bad{border-radius:11px;padding:12px 14px}
.b-good{background:var(--good-soft)}
.b-bad{background:var(--warn-soft)}
.b-good .lab{color:var(--good)}
.b-bad .lab{color:var(--warn)}
.b-good ul,.b-bad ul{margin:0;padding:0;list-style:none}
.b-good li,.b-bad li{display:flex;gap:9px;align-items:flex-start;font-size:15px;line-height:1.45;margin-bottom:6px}
.b-good li:last-child,.b-bad li:last-child{margin-bottom:0}
.b-good li::before{content:"✓";color:var(--good);font-weight:800;flex:none;font-size:14px;line-height:1.5}
.b-bad li::before{content:"✕";color:var(--warn);font-weight:800;flex:none;font-size:13px;line-height:1.6}

/* numbered micro-steps */
.b-steps ol{margin:0;padding:0;list-style:none;counter-reset:s}
.b-steps li{counter-increment:s;display:flex;gap:11px;align-items:flex-start;
  font-size:15px;line-height:1.45;margin-bottom:10px}
.b-steps li:last-child{margin-bottom:0}
.b-steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:7px;
  background:currentColor;color:var(--post);font-size:12px;font-weight:700;
  display:grid;place-items:center;margin-top:1px}

/* sentences a teacher can actually say */
.b-say .line{background:var(--post);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:8px;font-size:15px;line-height:1.45;position:relative}
.b-say .line:last-child{margin-bottom:0}
.b-say .line::before{content:"";position:absolute;left:13px;bottom:-5px;width:9px;height:9px;
  background:var(--post);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  transform:rotate(45deg)}
.b-avoid{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.45;
  padding:11px 13px;border-radius:10px;background:var(--warn-soft)}
.b-avoid b{color:var(--warn);flex:none;font-weight:700}

/* a worked solution */
.b-work{background:var(--post);border:1px solid var(--line);border-radius:11px;padding:6px 0;overflow:hidden}
.b-work .row{display:flex;gap:12px;align-items:center;padding:9px 14px;
  font-size:15.5px;font-variant-numeric:tabular-nums}
.b-work .row+.row{border-top:1px solid var(--line-soft)}
.b-work .n{font-size:11px;font-weight:700;color:var(--muted);width:12px;flex:none}
.b-note{font-size:15px;line-height:1.48}

/* tap to find out */
.reveal-btn{width:100%;min-height:50px;border:1.5px dashed var(--line);border-radius:12px;
  background:transparent;color:inherit;font-size:14.5px;font-weight:650;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all var(--t)}
.reveal-btn:hover{border-color:currentColor}
.reveal-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden-part{display:none}
.hidden-part.open{display:block;animation:fade .3s cubic-bezier(.2,.8,.2,1)}

/* the closing line */
.away{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding-top:13px;
  border-top:1px solid rgba(25,27,41,.09)}
.away .ic{width:20px;height:20px;flex:none;margin-top:1px}
.away .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.away p{font-size:15px;line-height:1.48;font-weight:550}

.card[data-cat="Spark"]   .media{background:var(--cat-spark-bg)}
.card[data-cat="Mirror"]  .media{background:var(--cat-mirror-bg)}
.card[data-cat="Bridge"]  .media{background:var(--cat-bridge-bg)}
.card[data-cat="Compass"] .media{background:var(--cat-compass-bg)}
.card[data-cat="Spark"]   .avatar{background:linear-gradient(135deg,var(--cat-spark-a),var(--cat-spark-b));--ring:var(--cat-spark-a)}
.card[data-cat="Mirror"]  .avatar{background:linear-gradient(135deg,var(--cat-mirror-a),var(--cat-mirror-b));--ring:var(--cat-mirror-a)}
.card[data-cat="Bridge"]  .avatar{background:linear-gradient(135deg,var(--cat-bridge-a),var(--cat-bridge-b));--ring:var(--cat-bridge-a)}
.card[data-cat="Compass"] .avatar{background:linear-gradient(135deg,var(--cat-compass-a),var(--cat-compass-b));--ring:var(--cat-compass-a)}
.card[data-cat="Spark"]   .tag,.card[data-cat="Spark"]   .illus,.card[data-cat="Spark"]   .blk .lab{color:var(--cat-spark-fg)}
.card[data-cat="Mirror"]  .tag,.card[data-cat="Mirror"]  .illus,.card[data-cat="Mirror"]  .blk .lab{color:var(--cat-mirror-fg)}
.card[data-cat="Bridge"]  .tag,.card[data-cat="Bridge"]  .illus,.card[data-cat="Bridge"]  .blk .lab{color:var(--cat-bridge-fg)}
.card[data-cat="Compass"] .tag,.card[data-cat="Compass"] .illus,.card[data-cat="Compass"] .blk .lab{color:var(--cat-compass-fg)}

/* ---------- the one question ---------- */
.ask{padding:16px 14px}
.ask .q{font-size:15px;font-weight:650;margin-bottom:11px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:52px;
  padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--app-bg);
  font-size:15px;line-height:1.3;transition:all var(--t)}
.opt:hover{border-color:var(--accent)}
.opt .dot{width:18px;height:18px;border-radius:50%;flex:none;position:relative;
  border:2px solid var(--muted);opacity:.55;transition:all var(--t)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt.on .dot{background:var(--accent);border-color:var(--accent);opacity:1}
.opt.on .dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--post)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
  padding:14px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  font-size:16.5px;font-weight:650;transition:opacity var(--t),transform var(--t)}
.btn:hover{opacity:.93}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:550}

/* ---------- consent ---------- */
.consent{background:var(--post);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-top:18px}
.consent p{font-size:15.5px;line-height:1.58}
.consent p+p{margin-top:12px}
.what{background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin-top:16px}
.what ul{margin:8px 0 0;padding-left:20px;font-size:14.5px;line-height:1.55}
.what li{margin-bottom:3px}
.what b{font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* ---------- survey ---------- */
.qblock{background:var(--post);border:1px solid var(--line);border-radius:16px;padding:16px 15px;margin-top:14px}
.qblock .qn{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.qblock .qt{font-size:16px;font-weight:650;line-height:1.35;margin-bottom:12px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.scale button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--app-bg);
  font-size:16px;font-weight:650;transition:all var(--t)}
.scale button:hover{border-color:var(--accent)}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px}
textarea{width:100%;min-height:130px;padding:14px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--app-bg);color:var(--text);font:inherit;font-size:16px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}

/* ---------- done ---------- */
.done{text-align:center;padding:12vh 0 0}
.done .mark{width:72px;height:72px;border-radius:50%;background:var(--ok);margin:0 auto 22px;display:grid;place-items:center}
.done .mark svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:60;
  max-width:calc(100% - 36px);padding:12px 18px;border-radius:13px;background:var(--text);color:var(--app-bg);
  font-size:14.5px;opacity:0;pointer-events:none;transition:all var(--t);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.foot{text-align:center;margin-top:22px}
</style>
</head>
<body>

<header class="bar">
  <div class="inner">
    <span class="brand">Oppija AI<span id="brandsub">Research study</span></span>
    <span class="step" id="step"></span>
  </div>
  <div class="track"><i id="track"></i></div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   Oppija AI — teacher study
   Ten cards, one question each, then a ten-question survey.
   Plain HTML, CSS and vanilla JS. No build step, no dependencies.
   ------------------------------------------------------------
   PASTE YOUR APPS SCRIPT URL HERE. Leave it as it is and every
   answer is written to the browser console instead, so the app
   still works end to end for testing.
   ============================================================ */

const LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbzOfEnPvjfJx56Y9YS0hNeAejnW1xO0UtRHZ3JE0K4Ck2nyjw2EZnT7l7jmLj45IR3NtQ/exec";

/* ---------- the ten cards ----------------------------------
   Alternating: AI literacy (Compass) on every odd card.

   Each card SHOWS the thing rather than describing it. A card is
   a title, an optional one-line setup, a few visual blocks, and
   one closing line. Block types:

     ai      what the AI produced, in its own box
     check   the reality, against it
     bad     a labelled list of what not to do
     good    a labelled list of what to do
     steps   numbered micro-steps
     say     sentences a teacher can actually use
     avoid   one thing not to do
     work    a worked solution, one line per row
     note    a plain line

   revealFrom: n  hides every block from index n behind a tap, so
   the teacher thinks for a second before seeing the answer.
   ============================================================ */

const CARDS = [

  { id: "c01", module: "Compass", topic: "Critical AI evaluation", illus: "ref",
    title: "The reference that doesn't exist",
    setup: "You ask AI for a source to back up tomorrow's lesson.",
    revealFrom: 1,
    body: [
      { t: "ai", text: "Kumar, R. (2019). Teaching Science in Indian Classrooms. Journal of Educational Practice, 14(3), 88–97." },
      { t: "check", text: "The journal is real. The author is real. The article was never written." }
    ],
    takeaway: "Open the source before you quote it. If it has no link that opens, treat it as not there." },

  { id: "c02", module: "Spark", topic: "Student engagement", illus: "quiet",
    title: "The quiet child who knew the answer",
    setup: "The same six hands go up every day. Forty others say nothing.",
    body: [
      { t: "steps", label: "Three ways to hear everyone", items: [
        "Write first. Sixty seconds of silence, no hands.",
        "Tell your neighbour. Then you ask the pairs, not the person.",
        "Draw a name. Ask the question first, then draw."
      ] }
    ],
    takeaway: "Any of the three works. The point is that answering stops being a race." },

  { id: "c03", module: "Compass", topic: "AI literacy", illus: "think",
    title: "Let AI plan. Let students think.",
    setup: "A worksheet made by AI is fine. Answers copied from AI are not.",
    body: [
      { t: "good", label: "Good use", items: [
        "Practice questions, easiest to hardest",
        "A second example when yours runs out",
        "Three ways to word the same question"
      ] },
      { t: "bad", label: "Hand this back to the student", items: [
        "The explaining",
        "The reasoning",
        "The answer, in their own words"
      ] }
    ],
    takeaway: "Ask for the material. Never ask for the thinking." },

  { id: "c04", module: "Mirror", topic: "Critical thinking", illus: "error",
    title: "Can your students spot the mistake?",
    setup: "Put this on the board. One line is wrong.",
    revealFrom: 1,
    body: [
      { t: "work", lines: ["Solve  3(x + 4) = 21", "3x + 4 = 21", "3x = 17", "x = 17/3"] },
      { t: "check", text: "Line 2. The 3 was multiplied into x but not into 4. It should read 3x + 12 = 21, so x = 3." }
    ],
    takeaway: "Ask what the person was thinking when they made it. That answer teaches more than the correction." },

  { id: "c05", module: "Compass", topic: "Responsible AI use", illus: "detect",
    title: "This essay sounds like AI",
    setup: "A detector says 92%. That number is not evidence.",
    body: [
      { t: "bad", label: "Not proof", items: [
        "A detector percentage",
        "Writing that is suddenly too clean",
        "A student who writes better in English than they speak"
      ] },
      { t: "good", label: "Enough to act on", items: [
        "Ask them to explain paragraph two out loud",
        "Look at the drafts and the dates",
        "One short paragraph, written in front of you"
      ] }
    ],
    takeaway: "Detectors flag second-language writers most of all. Start with a conversation, never a score." },

  { id: "c06", module: "Bridge", topic: "Interpersonal skills", illus: "call",
    title: "A parent call that builds trust",
    setup: "Nothing is wrong yet. That is exactly when to call.",
    body: [
      { t: "say", items: [
        "I'm calling with something good first — she's been helping the others at her table.",
        "One thing I'm watching: homework has come in twice this month.",
        "Can we try one thing together for two weeks, and I'll call you again?"
      ] },
      { t: "avoid", text: "Opening with the problem. The parent stops listening at the first sentence." }
    ],
    takeaway: "Good first, one concern, one agreed step. Three sentences, under two minutes." },

  { id: "c07", module: "Compass", topic: "Effective prompting", illus: "task",
    title: "Give AI a real classroom",
    setup: "Same tool, same minute, two different results.",
    body: [
      { t: "bad", label: "What most teachers type", items: ["Make a lesson on photosynthesis"] },
      { t: "good", label: "What gets something usable", items: [
        "Class 7 Science. 35 minutes, 48 students, one blackboard, no printing. Explain photosynthesis for students reading two years below level. Then five questions, easiest first, with answers separately."
      ] }
    ],

/* ============================================================
   LOGGING
   One row per answer, sent the moment it is given, so a teacher
   who stops at card 6 still leaves six cards of usable data.
   Nothing identifying is ever sent — see PAYLOAD below.
   ============================================================ */

let QUEUE = [];
let BUSY = false;

function endpointReady() {
  return typeof LOG_ENDPOINT === "string" && LOG_ENDPOINT && LOG_ENDPOINT !== "PASTE_URL_HERE";
}

/* A random id for this sitting only. It is never stored, never
   reused, and cannot be traced back to a person — it exists so
   one teacher's ten answers can be read as one response. */
function makeSession() {
  try {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  } catch (e) { }
  return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

const SESSION = makeSession();
const STARTED = Date.now();

function log(event, data) {
  try {
    const row = {
      session: SESSION,
      ts: new Date().toISOString(),
      event: event,
      card_id: "", question: "", answer: "", seconds: "", idx: "",
      lang: (navigator.language || "")
    };
    if (data) for (const k in data) { if (k in row) row[k] = data[k]; }
    row.event = event;
    QUEUE.push(row);
    flush();
  } catch (e) { /* logging must never break the study */ }
}

function post(row) {
  try {
    const body = JSON.stringify(row);
    if (navigator.sendBeacon) {
      const blob = new Blob([body], { type: "text/plain;charset=UTF-8" });
      if (navigator.sendBeacon(LOG_ENDPOINT, blob)) return Promise.resolve(true);
    }
    return fetch(LOG_ENDPOINT, {
      method: "POST", body: body, keepalive: true, mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=UTF-8" }
    }).then(function () { return true; }).catch(function () { return false; });
  } catch (e) { return Promise.resolve(false); }
}

function flush() {
  try {
    if (BUSY || !QUEUE.length) return;
    if (!endpointReady()) {
      while (QUEUE.length) console.log("[oppija]", QUEUE.shift());
      return;
    }
    BUSY = true;
    const batch = QUEUE; QUEUE = [];
    Promise.all(batch.map(function (r) {
      return post(r).then(function (ok) { return ok ? null : r; }).catch(function () { return r; });
    })).then(function (res) {
      res.forEach(function (r) { if (r) QUEUE.push(r); });
    }).catch(function () {
      batch.forEach(function (r) { QUEUE.push(r); });
    }).then(function () { BUSY = false; });
  } catch (e) { BUSY = false; }
}

window.addEventListener("online", flush);
window.addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") flush();
});
setInterval(flush, 15000);

        '<textarea id="freetext" placeholder="' + esc(FREETEXT.placeholder) + '"></textarea>' +
      '</div>' +

      '<button class="btn" id="submit" type="button" style="margin-top:18px">Submit and finish</button>' +
      '<p class="tiny foot">You can submit with questions left blank.</p>' +
    '</section>';

  /* each answer is logged as it is given, so a part-finished survey
     still counts for something */
  Array.prototype.forEach.call(main.querySelectorAll("[data-q]"), function (group) {
    const qid = group.dataset.q;
    const q = SURVEY.filter(function (x) { return x.id === qid; })[0];
    Array.prototype.forEach.call(group.querySelectorAll("button"), function (b) {
      b.onclick = function () {
        Array.prototype.forEach.call(group.querySelectorAll("button"), function (o) {
          o.classList.remove("on");
        });
        b.classList.add("on");
        STATE.survey[qid] = b.dataset.v;
        log("survey_answer", { question: q.t, answer: b.dataset.v, idx: qid });
      };
    });
  });

  document.getElementById("submit").onclick = function () {
    const txt = (document.getElementById("freetext").value || "").trim();
    if (txt) log("free_text", { question: FREETEXT.t, answer: txt.slice(0, 4000), idx: FREETEXT.id });
    log("survey_submit", {
      answer: Object.keys(STATE.survey).length + " of " + SURVEY.length + " answered",
      seconds: Math.round((Date.now() - STARTED) / 1000)
    });
    flush();
    go(renderDone);
  };
}

/* ---------- done ---------- */

function renderDone() {
  STATE.step = "done";
  setProgress(TOTAL_STEPS, "Finished");
  document.getElementById("brandsub").textContent = "Thank you";
  main.innerHTML =
    '<section class="screen done">' +
      '<div class="mark">' + TICK + '</div>' +
      '<h1>Thank you.</h1>' +
      '<p class="lede" style="max-width:340px;margin:14px auto 0">Your answers are in, anonymously. They go straight into deciding what the real app should do.</p>' +
      '<p class="tiny" style="margin-top:22px">Faculty of Information Technology, University of Jyväskylä</p>' +
      '<p class="tiny" style="margin-top:6px">You can close this page now.</p>' +
    '</section>';
  flush();
}

/* ---------- boot ---------- */

try {
  renderConsent();
  log("opened", {});
} catch (e) {
  console.error(e);
}
</script>
</body>
</html>
